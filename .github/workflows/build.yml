name: Build PS1 Shooter Game

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential wget unzip genisoimage

    - name: Download and Setup PSn00bSDK
      run: |
        # Buat folder pusat untuk SDK
        sudo mkdir -p /opt/psn00bsdk
        
        # Unduh rilisan resmi PSn00bSDK untuk arsitektur Linux
        wget https://github.com
        
        # Ekstrak file langsung ke dalam direktori /opt/psn00bsdk
        sudo unzip PSn00bSDK-0.24-Linux.zip -d /opt/psn00bsdk
        
        # Berikan izin akses penuh ke folder agar proses eksekusi tidak tertahan permission
        sudo chmod -R 777 /opt/psn00bsdk

    - name: Run CMake Configuration & Build
      run: |
        # Daftarkan folder biner MIPS GCC bawaan SDK ke $PATH sistem GitHub Actions
        export PATH="/opt/psn00bsdk/bin:$PATH"
        
        # Set variabel lingkungan penunjuk pustaka inti internal PSn00bSDK
        export PSN00BSDK_LIBS="/opt/psn00bsdk/lib/libpsn00b"
        
        # Jalankan CMake dengan konfigurasi mengarah ke file generator Ninja dan letak sdk.cmake yang tepat
        cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=/opt/psn00bsdk/lib/libpsn00b/cmake/sdk.cmake .
        
        # Eksekusi kompilasi kode program C menjadi executable PS1
        cmake --build build

    - name: Upload Finished PS1 ISO
      uses: actions/upload-artifact@v4
      with:
        name: ps1-shooter-game-disc
        path: |
          build/*.iso
          build/*.bin
          build/*.cue
