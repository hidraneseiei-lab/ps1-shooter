name: Build PS1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Download PSn00bSDK
        run: |
          curl -L -o psn00bsdk.zip https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/PSn00bSDK-0.24-Linux.zip
          ls -la psn00bsdk.zip
          unzip -q psn00bsdk.zip -d $HOME/psn00bsdk

      - name: Lihat isi SDK
        run: |
          find $HOME/psn00bsdk -maxdepth 3 | head -60
          echo "--- cari sdk.cmake ---"
          find $HOME/psn00bsdk -name "sdk.cmake"

      - name: Build
        run: |
          SDK_CMAKE=$(find $HOME/psn00bsdk -name "sdk.cmake" | head -1)
          echo "Pakai toolchain: $SDK_CMAKE"
          SDK_ROOT=$(dirname $(dirname $(dirname "$SDK_CMAKE")))
          echo "$SDK_ROOT/bin" >> $GITHUB_PATH
          export PATH="$SDK_ROOT/bin:$PATH"
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$SDK_CMAKE" \
            .
          cmake --build build

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ps1-game
          path: |
            build/shooter.bin
            build/shooter.cue
            build/shooter.exe
